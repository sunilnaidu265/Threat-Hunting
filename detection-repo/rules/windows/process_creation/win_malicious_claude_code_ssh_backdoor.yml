title: Malicious Claude Code SSH Backdoor Indicators
id: 31d56291-2ad3-48a4-8d51-8d7f189d9a79
status: experimental
description: Detects editor-helper SSH backdoor behaviors associated with malicious Claude Code or Cursor marketplace abuse, including authorized_keys writes, reverse SSH tunnels, outbound editor-helper SSH, and a known C2 IP.
author: Copilot
date: 2026-10-30
references:
  - https://attack.mitre.org/techniques/T1098/004/
  - https://attack.mitre.org/techniques/T1572/
  - https://attack.mitre.org/techniques/T1021/004/
  - https://attack.mitre.org/techniques/T1195/002/
logsource:
  category: process_creation
  product: windows
definition:
  selection:
    Image|endswith:
      - '\Cursor.exe'
      - '\Code.exe'
      - '\Cursor Helper.exe'
      - '\Code Helper.exe'
  condition: selection
falsepositives:
  - Legitimate editor or IDE use with SSH configuration changes
  - Approved developer tooling that creates SSH keys or maintains remote tunnels
level: high
fields:
  - @timestamp
  - Indicator
  - aid
  - ComputerName
  - UserName
  - ContextBaseFileName
  - ParentBaseFileName
  - FileName
  - CommandLine
  - TargetFileName
  - RemoteAddressIP4
  - RemotePort
tags:
  - attack.persistence
  - attack.command_and_control
  - attack.lateral_movement
  - attack.t1098.004
  - attack.t1572
  - attack.t1021.004
  - attack.t1195.002
query: |
  // Vigil: Malicious Claude Code 2.1.313 (Cursor marketplace) - SSH backdoor indicators
  // Covers: editor helper writes authorized_keys, reverse SSH tunnel, editor helper outbound SSH, known C2 IP
  // ATT&CK: T1098.004, T1572, T1021.004, T1195.002

  #event_simpleName=/^(FileWritten|ProcessRollup2|NetworkConnectIP4)$/
  | case {
      #event_simpleName=FileWritten
        TargetFileName=/[\\\/]\.[sS][sS][hH][\]?[\\\/].*[aA][uU][tT][hH][oO][rR][iI][zZ][eE][dD]_[kK][eE][yY][sS]$/i
        ContextBaseFileName=/^(Cursor|Code)(\s+Helper.*)?(\.exe)?$/i
        | Indicator := "Editor process wrote SSH authorized_keys";
      #event_simpleName=ProcessRollup2
        FileName=/^(ssh|autossh)(\.exe)?$/i
        CommandLine=/-R\s*['"]?\*?:?0:localhost:22/i
        | Indicator := "Reverse SSH tunnel to localhost:22";
      #event_simpleName=NetworkConnectIP4
        ContextBaseFileName=/^(Cursor|Code)(\s+Helper.*)?(\.exe)?$/i
        RemotePort=22
        | Indicator := "Editor helper outbound SSH";
      #event_simpleName=NetworkConnectIP4
        RemoteAddressIP4="134.209.82.225"
        | Indicator := "Known C2 IP (single-source IOC)";
    }
  | table([@timestamp, Indicator, aid, ComputerName, UserName, ContextBaseFileName,
           ParentBaseFileName, FileName, CommandLine, TargetFileName, RemoteAddressIP4, RemotePort])
